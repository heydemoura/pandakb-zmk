# ---------------------------------------------------------------------------
# Lily58 — battery-oriented configuration
#
# The dominant drains on this build were:
#   1. 36 WS2812 per half (see lily58.dtsi chain-length). These draw ~0.5-1mA
#      EACH even when displaying black, so ~25-35mA/half continuously. The only
#      way to stop that is to cut the switched VCC rail via ext_power.
#   2. CONFIG_ZMK_SLEEP=n, which meant that drain ran 24/7, including overnight.
#
# RGB is compiled out. The OLEDs are ON: the display is wanted by default, and
# on a nice!nano it shares the ext_power-switched VCC rail with the LED strip,
# so keeping the display means keeping that rail powered while awake -- and the
# LEDs' quiescent draw comes back with it. Deep sleep still cuts the whole rail
# after 15min idle, and the OLED blanks after 60s, so the expensive state only
# lasts while the board is actually in use.
#
# `&ext_power EP_TOG` (Layer 2) still cuts the rail by hand for long unplugged
# stretches -- note it takes the OLED with it. The state persists in settings,
# so if the display ever stays dark after flashing, press EP_ON.
# ---------------------------------------------------------------------------

# Change keyboard default display name
CONFIG_ZMK_KEYBOARD_NAME="Lily58"

# Keyboard debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --- Radio -----------------------------------------------------------------
# Leave TX power at the 0dBm default. +8dBm roughly doubles radio draw and is
# only needed for problem split links.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Fix Windows battery reporting related errors
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# --- Sleep -----------------------------------------------------------------
# Idle after 60s: radio backs off and the OLED blanks. Instant wake on keypress.
CONFIG_ZMK_IDLE_TIMEOUT=60000
# Deep sleep after 15min of inactivity. This is the single biggest saving:
# it drops the board to ~20uA and, via the ext_power PM hook, kills the VCC
# rail so the LED strip stops drawing entirely. Wake takes <1s to reconnect.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- RGB underglow: OFF ----------------------------------------------------
CONFIG_ZMK_RGB_UNDERGLOW=n
# Do NOT set CONFIG_WS2812_STRIP here. With underglow off, the LED strip
# driver is never selected, so the symbol is undefined -- and Zephyr treats
# assigning to an undefined symbol as a fatal Kconfig warning.

# --- External power --------------------------------------------------------
# The rail powers BOTH the OLED and the LED strip, so it must stay on for the
# display to work. EP_ON/EP_OFF/EP_TOG on Layer 2 control it by hand.
CONFIG_ZMK_EXT_POWER=y

# --- OLED: ON --------------------------------------------------------------
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
# Blank the OLED once idle (ZMK_IDLE_TIMEOUT above). Default y for SSD1306,
# set explicitly so it is not lost if that default ever changes. This turns
# off the pixels, not the VCC rail -- the LED strip keeps drawing until deep
# sleep or an explicit EP_OFF.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# Use the system work queue; a dedicated UI thread costs an extra 3K stack.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=y
# Widgets: keep it to the two that earn their pixels.
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# --- Battery reporting -----------------------------------------------------
# Report every 10 minutes; each report is a BLE notification on both halves.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# --- ZMK Studio ------------------------------------------------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# --- Rotary encoders -------------------------------------------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- Pointing --------------------------------------------------------------
CONFIG_ZMK_POINTING=y
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
