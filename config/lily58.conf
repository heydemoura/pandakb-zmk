# ---------------------------------------------------------------------------
# Lily58 — battery-oriented configuration
#
# The dominant drains on this build were:
#   1. 36 WS2812 per half (see lily58.dtsi chain-length). These draw ~0.5-1mA
#      EACH even when displaying black, so ~25-35mA/half continuously. The only
#      way to stop that is to cut the switched VCC rail via ext_power.
#   2. CONFIG_ZMK_SLEEP=n, which meant that drain ran 24/7, including overnight.
#
# On a nice!nano the OLED shares that same VCC rail, so the display goes with
# the LEDs. Both are compiled out below; `&ext_power EP_OFF` on the WindowMGT
# layer cuts the rail itself (state persists in settings).
# ---------------------------------------------------------------------------

# Change keyboard default display name
CONFIG_ZMK_KEYBOARD_NAME="Lily58"

# Keyboard debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --- Radio -----------------------------------------------------------------
# Leave TX power at the 0dBm default. +8dBm roughly doubles radio draw and is
# only needed for problem split links.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Fix Windows battery reporting related errors
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# --- Sleep -----------------------------------------------------------------
# Idle after 30s: radio backs off, display/LED subsystems park. Instant wake.
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Deep sleep after 15min of inactivity. This is the single biggest saving:
# it drops the board to ~20uA and, via the ext_power PM hook, kills the VCC
# rail so the LED strip stops drawing entirely. Wake takes <1s to reconnect.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- RGB underglow: OFF ----------------------------------------------------
CONFIG_ZMK_RGB_UNDERGLOW=n
# Do NOT set CONFIG_WS2812_STRIP here. With underglow off, the LED strip
# driver is never selected, so the symbol is undefined -- and Zephyr treats
# assigning to an undefined symbol as a fatal Kconfig warning.

# --- External power --------------------------------------------------------
# Keep the driver so `&ext_power EP_OFF` can cut the VCC rail (LEDs + OLED).
# Press it once after flashing; the state is saved and survives reboots.
CONFIG_ZMK_EXT_POWER=y

# --- OLED: OFF -------------------------------------------------------------
# Shares the VCC rail with the LED strip, and costs ~10mA on its own.
# Set back to =y (and re-enable the widgets) if you want the displays back.
CONFIG_ZMK_DISPLAY=n

# --- Battery reporting -----------------------------------------------------
# Report every 10 minutes; each report is a BLE notification on both halves.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# --- ZMK Studio ------------------------------------------------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# --- Rotary encoders -------------------------------------------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- Pointing --------------------------------------------------------------
CONFIG_ZMK_POINTING=y
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
