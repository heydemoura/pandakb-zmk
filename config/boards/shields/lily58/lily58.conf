# Shield-level defaults for the Lily58.
#
# Keep this file minimal: the real configuration lives in config/lily58.conf,
# which is merged on top. Anything set here that also appears there is just a
# chance for the two to drift out of sync, so power-related options (RGB,
# display, sleep, TX power) are deliberately owned by config/lily58.conf only.

CONFIG_ZMK_KEYBOARD_NAME="Lily58"

# Keyboard debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Rotary encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
