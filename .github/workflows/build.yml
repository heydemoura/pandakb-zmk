name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      # build.yaml defines the build matrix, so a change to it must rebuild.
      # Without this a new/edited target silently never builds.
      - "build.yaml"
      - ".github/workflows/build.yml"

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.2.1
