# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: lily58_left
    snippet: studio-rpc-usb-uart
  - board: nice_nano_v2
    shield: lily58_right
  - board: nice_nano_v2
    shield: settings_reset
  # Same diagnostic build as on zmk-for-lily, so this baseline can be compared
  # like for like.
  # ZMK_STUDIO is on via the shield confs, and its UART RPC transport needs the
  # zmk,studio-rpc-uart chosen node that only the studio-rpc-usb-uart snippet
  # supplies. Only one snippet is allowed per target, so Studio must be off here.
  - board: nice_nano_v2
    shield: lily58_left
    snippet: zmk-usb-logging
    artifact-name: lily58_left-usblogging
    cmake-args: -DCONFIG_ZMK_STUDIO=n
