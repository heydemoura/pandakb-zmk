# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: lily58_left
    snippet: studio-rpc-usb-uart
  - board: nice_nano_v2
    shield: lily58_right
  - board: nice_nano_v2
    shield: settings_reset
  # Diagnostic build for the left half (central), used to debug BLE.
  # Streams ZMK logs over the USB CDC console -- flash it, plug in, and open
  # the serial port to see why advertising/pairing is failing.
  # Not for daily use: it replaces the Studio snippet (only one snippet is
  # supported per target) and keeps the USB console alive.
  - board: nice_nano_v2
    shield: lily58_left
    snippet: zmk-usb-logging
    artifact-name: lily58_left-usblogging
    # Studio's UART RPC needs the chosen node only the Studio snippet provides.
    cmake-args: -DCONFIG_ZMK_STUDIO=n
